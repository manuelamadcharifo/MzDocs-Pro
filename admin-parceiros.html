<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Admin — Parceiros MzDocs</title>
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/assets/css/styles.css"/>
  <style>
    :root{--ink:#07101F;--muted:#64748B;--border:#E2E8F0;--surface:#F8FAFD;--white:#fff;--blue:#3B82F6;--green:#009A44;--red:#EF4444;--gold:#F59E0B}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}
    .hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .hdr-name{font-size:15px;font-weight:800;color:#fff}
    .hdr-name span{color:var(--gold)}
    .btn-back{color:rgba(255,255,255,.6);font-size:13px;text-decoration:none}
    /* CONTAINER — largura máxima 1024px reutilizável, mesma classe usada em
       toda a app (ver assets/css/styles.css). Substitui o max-width/margin
       que estava directamente no .wrap desta página. */
    .container{max-width:1024px;margin:0 auto;padding:0 16px;box-sizing:border-box}
    .wrap{padding:24px 14px 60px}
    .page-title{font-size:20px;font-weight:800;margin-bottom:4px}
    .page-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
    .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
    .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .tab .cnt{display:inline-block;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:800}
    .card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(7,16,31,.05)}
    .card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
    .card-name{font-size:15px;font-weight:800;color:var(--ink)}
    .card-owner{font-size:12px;color:var(--muted);margin-top:1px}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
    .badge-pending{background:#FEF9C3;color:#854D0E}
    .badge-approved{background:#DCFCE7;color:#166534}
    .badge-rejected{background:#FEE2E2;color:#991B1B}
    .badge-off{background:#F1F5F9;color:#475569}
    .card-info{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
    .card-info strong{color:var(--ink);font-weight:700}
    .svc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
    .svc-tag{background:#EFF6FF;color:var(--blue);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
    /* NOVO — sub-filtro por tipo + selo/bio de advogado */
    .type-tabs{display:flex;gap:6px;margin-bottom:14px}
    .type-tab{padding:6px 14px;border-radius:16px;border:1.5px solid var(--border);background:var(--white);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
    .type-tab.active{background:#EFF6FF;border-color:var(--blue);color:var(--blue)}
    .type-badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:middle}
    .type-badge-advogado{background:#EEF2FF;color:#4338CA}
    .type-badge-papelaria{background:#F0FDF4;color:#166534}
    .oam-line{font-size:12.5px;color:#047857;font-weight:700;margin-bottom:6px}
    .bio-line{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
    .card-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{padding:9px 16px;border-radius:9px;border:none;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:opacity .15s}
    .btn:active{opacity:.75}
    .btn-approve{background:var(--green);color:#fff}
    .btn-reject{background:var(--red);color:#fff}
    .btn-toggle-on{background:#F1F5F9;color:var(--ink);border:1.5px solid var(--border)}
    .btn-toggle-off{background:var(--green);color:#fff}
    .btn-wa{background:#25D366;color:#fff}
    .empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:14px}
    #loginSection{max-width:360px;margin:80px auto 0;background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:28px 24px;text-align:center}
    #loginSection h2{font-size:18px;font-weight:800;margin-bottom:6px}
    #loginSection p{font-size:13px;color:var(--muted);margin-bottom:20px}
    .inp{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;outline:none;margin-bottom:10px;transition:border-color .2s}
    .inp:focus{border-color:var(--blue)}
    .btn-login{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
    #loginErr{color:var(--red);font-size:13px;margin-top:8px;display:none}
    #adminPanel{display:none}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

<header class="hdr">
  <a href="/" style="display:flex;align-items:center;gap:8px;text-decoration:none" data-track-link>
    <img id="siteLogo" src="/assets/icons/mzdocs-pro-transparent.svg" alt="MzDocs Pro" style="max-height:150px;height:auto;width:auto;display:block;margin-left:-70px;">
    <div id="siteLogoFallback" class="hdr-name" style="display:none">Mz<span>Docs</span> Pro · Admin Parceiros</div>
  </a>
  <script>
  document.getElementById('siteLogo').addEventListener('error', function(){
    this.style.display = 'none';
    document.getElementById('siteLogoFallback').style.display = 'block';
  });
  </script>
  <!-- CORRIGIDO (auditoria 3.1): antes ia para "/" (site público) — sem
       nenhuma forma de voltar ao painel admin a partir daqui. Como esta
       página só é usada por administradores (ver loginSection abaixo), o
       "voltar" lógico é o painel admin, não o site público. -->
  <a href="/admin.html" class="btn-back" data-track-link>← Painel Admin</a>
</header>

<!-- LOGIN -->
<div id="loginSection">
  <h2>🔐 Área Restrita</h2>
  <p>Acesso apenas para administradores MzDocs.</p>
  <input class="inp" type="email" id="adminEmail" placeholder="Email de admin"/>
  <div style="position:relative">
    <input class="inp" type="password" id="adminPass" placeholder="Password" style="padding-right:44px"/>
    <button type="button" style="position:absolute;right:12px;top:13px;background:none;border:none;cursor:pointer;font-size:16px" data-action="togglePasswordVisibility">👁️</button>
  </div>
  <button class="btn-login" data-action="doLogin">Entrar</button>
  <div id="loginErr">❌ Email ou password incorrectos.</div>
</div>

<!-- PAINEL ADMIN -->
<div id="adminPanel">
  <div class="wrap container">
    <div class="page-title">🏪 Gestão de Parceiros</div>
    <div class="page-sub">Aprovar, rejeitar e gerir papelarias e gráficas parceiras.</div>

    <div class="tabs">
      <button class="tab active" data-status="pending" data-action="switchTab">⏳ Pendentes <span class="cnt" id="cntPending">0</span></button>
      <button class="tab" data-status="approved" data-action="switchTab">✅ Aprovadas</button>
      <button class="tab" data-status="rejected" data-action="switchTab">❌ Rejeitadas</button>
    </div>

    <!-- NOVO — sub-filtro por tipo de parceiro -->
    <div class="type-tabs">
      <button class="type-tab active" data-type="" data-action="switchType">Todos</button>
      <button class="type-tab" data-type="papelaria" data-action="switchType">🏪 Papelarias</button>
      <button class="type-tab" data-type="advogado" data-action="switchType">⚖️ Advogados</button>
    </div>

    <div id="partnersList"></div>
  </div>
</div>

<script>
// SEGURANÇA (auditoria Jul/2026): dados de candidatos a parceiro (nome do
// negócio, nome do dono, bio, nº de credencial) são texto livre submetido
// por quem se candidata — sem escape, um candidato malicioso executava
// JavaScript na sessão do admin ao rever candidaturas pendentes.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}

// CSP FASE 1 (auditoria Ago/2026): delegação de eventos por data-action, em
// vez de onclick="..." inline — mesma lógica usada em AdminApp.js/afiliado.html.
const _adminParcActionHandlers = {
  togglePasswordVisibility: (d, el) => {
    const i = el.previousElementSibling;
    i.type = i.type === 'password' ? 'text' : 'password';
    el.textContent = i.type === 'password' ? '👁️' : '🙈';
  },
  doLogin:            () => doLogin(),
  switchTab:           (d, el) => switchTab(el),
  switchType:          (d, el) => switchType(el),
  doAction:            (d) => doAction(d.verb, d.id),
  doToggle:            (d) => doToggle(d.id, d.active === 'true'),
  doRegenerateCode:    (d) => doRegenerateCode(d.id),
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const handler = _adminParcActionHandlers[el.dataset.action];
  if (handler) handler(el.dataset, el);
});

let AUTH_TOKEN = '';
let currentStatus = 'pending';
let currentType = ''; // '' = todos | 'papelaria' | 'advogado'

// ── LOGIN ────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const pass  = document.getElementById('adminPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';

  if (!email || !pass) { errEl.style.display='block'; errEl.textContent='⚠️ Preencha email e password.'; return; }

  try {
    const SUPA_URL  = await getSupaUrl();
    const SUPA_ANON = await getSupaAnon();
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPA_ANON },
      body: JSON.stringify({ email, password: pass }),
    });
    const data = await res.json();
    if (!data.access_token) throw new Error('sem token');
    AUTH_TOKEN = data.access_token;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadPartners('pending');
  } catch {
    errEl.style.display = 'block';
    errEl.textContent = '❌ Email ou password incorrectos ou sem permissão de admin.';
  }
}

// Busca config do backend para obter URL e anon key sem expor no código
async function getSupaUrl()  { const c = await getConfig(); return c.supabaseUrl || ''; }
async function getSupaAnon() { const c = await getConfig(); return c.supabaseAnonKey || ''; }
let _cfg = null;
async function getConfig() {
  if (_cfg) return _cfg;
  const r = await fetch('/api/misc?action=config');
  _cfg = await r.json();
  return _cfg;
}

// ── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentStatus = btn.dataset.status;
  loadPartners(currentStatus, currentType);
}

// NOVO — sub-filtro por tipo
function switchType(btn) {
  document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentType = btn.dataset.type;
  loadPartners(currentStatus, currentType);
}

// ── LOAD ─────────────────────────────────────────────────────────────────────
async function loadPartners(status, type = '') {
  const list = document.getElementById('partnersList');
  list.innerHTML = '<div class="empty">⏳ A carregar…</div>';
  try {
    const typeQs = type ? `&type=${type}` : '';
    const res = await fetch(`/api/partners?action=list&status=${status}${typeQs}`, {
      headers: { Authorization: `Bearer ${AUTH_TOKEN}` },
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    if (status === 'pending') {
      const cnt = document.getElementById('cntPending');
      if (cnt) cnt.textContent = data.partners.length;
    }
    renderPartners(data.partners, status);
  } catch (e) {
    list.innerHTML = `<div class="empty">❌ Erro: ${e.message}</div>`;
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderPartners(partners, status) {
  const list = document.getElementById('partnersList');
  if (!partners.length) {
    list.innerHTML = `<div class="empty">Nenhuma parceira ${status === 'pending' ? 'pendente' : status === 'approved' ? 'aprovada' : 'rejeitada'}.</div>`;
    return;
  }

  const SVC_LABEL = {
    impressao:'🖨️ Impressão', foto:'📷 Foto Docs', plastificacao:'🧊 Plastificação', encadernacao:'📖 Encadernação', conversao:'🔄 Conversão', digitalizar:'📲 Digitalização',
    // NOVO — áreas de atuação de advogado
    civil:'Civil', laboral:'Laboral', comercial:'Comercial', familia:'Família', penal:'Penal', imobiliario:'Imobiliário', fiscal:'Fiscal', sucessorio:'Sucessório',
  };

  list.innerHTML = partners.map(p => {
    const isLawyer = p.type === 'advogado';
    const badgeCls = p.status === 'approved' ? (p.active ? 'badge-approved' : 'badge-off') : `badge-${p.status}`;
    const badgeTxt = p.status === 'approved' ? (p.active ? '✅ Activa' : '⏸️ Inactiva') : p.status === 'rejected' ? '❌ Rejeitada' : '⏳ Pendente';
    const typeBadge = `<span class="type-badge ${isLawyer ? 'type-badge-advogado' : 'type-badge-papelaria'}">${isLawyer ? '⚖️ Advogado' : '🏪 Papelaria'}</span>`;
    const svcs = (p.services || []).map(s => `<span class="svc-tag">${SVC_LABEL[s] || s}</span>`).join('');
    const rating = p.rating_count > 0 ? `${(p.rating_sum/p.rating_count).toFixed(1)} ⭐ (${p.rating_count})` : 'Sem avaliações';
    const waLink = `https://wa.me/${p.whatsapp.replace(/\D/g,'')}`;
    // NOVO — nº OAM em destaque; lembrete de conferência manual enquanto
    // pendente, já que não há forma automática de validar a inscrição.
    const oamLine = isLawyer
      ? `<div class="oam-line">🛡️ OAM: ${escapeHtml(p.credential_number || '⚠️ não indicado')}${p.status === 'pending' ? ' — confirmar na Ordem antes de aprovar' : ''}</div>`
      : '';
    const bioLine = isLawyer && p.bio ? `<div class="bio-line">${escapeHtml(p.bio)}</div>` : '';

    let actions = '';
    if (p.status === 'pending') {
      actions = `
        <button class="btn btn-approve" data-action="doAction" data-verb="approve" data-id="${escapeHtml(p.id)}">✅ Aprovar</button>
        <button class="btn btn-reject"  data-action="doAction" data-verb="reject" data-id="${escapeHtml(p.id)}">❌ Rejeitar</button>
        <a href="${waLink}" target="_blank" rel="noopener" class="btn btn-wa">WhatsApp</a>`;
    } else if (p.status === 'approved') {
      actions = p.active
        ? `<button class="btn btn-toggle-on"  data-action="doToggle" data-id="${escapeHtml(p.id)}" data-active="false">⏸️ Desactivar</button>`
        : `<button class="btn btn-toggle-off" data-action="doToggle" data-id="${escapeHtml(p.id)}" data-active="true">▶️ Activar</button>`;
      // NOVO: para quando a parceira perde/esquece o código do portal.
      actions += `<button class="btn btn-toggle-on" data-action="doRegenerateCode" data-id="${escapeHtml(p.id)}">🔑 Reenviar código</button>`;
      actions += `<a href="${waLink}" target="_blank" rel="noopener" class="btn btn-wa">WhatsApp</a>`;
    } else {
      actions = `<button class="btn btn-approve" data-action="doAction" data-verb="approve" data-id="${escapeHtml(p.id)}">↩️ Reactivar</button>`;
    }

    return `<div class="card" id="card-${p.id}">
      <div class="card-header">
        <div>
          <div class="card-name">${escapeHtml(p.name)}${typeBadge}</div>
          <div class="card-owner">👤 ${escapeHtml(p.owner_name)}</div>
        </div>
        <span class="badge ${badgeCls}">${badgeTxt}</span>
      </div>
      ${oamLine}
      ${bioLine}
      <div class="card-info">
        <div>📞 <strong>${escapeHtml(p.phone)}</strong></div>
        <div>📲 <strong>${escapeHtml(p.whatsapp)}</strong></div>
        <div>📍 <strong>${escapeHtml(p.city)}</strong></div>
        <div>🏠 <strong>${escapeHtml(p.address)}</strong></div>
        <div>🕐 <strong>${escapeHtml(p.hours || 'Não indicado')}</strong></div>
        <div>⭐ <strong>${rating}</strong></div>
        <div>🌐 <strong>${p.lat?.toFixed(4)}, ${p.lng?.toFixed(4)}</strong></div>
        <div>📅 <strong>${new Date(p.created_at).toLocaleDateString('pt-MZ')}</strong></div>
      </div>
      <div class="svc-tags">${svcs}</div>
      <div class="card-actions">${actions}</div>
    </div>`;
  }).join('');
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
async function doAction(action, id) {
  const card = document.getElementById(`card-${id}`);
  if (card) card.style.opacity = '0.5';
  try {
    const res = await fetch(`/api/partners?action=${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${AUTH_TOKEN}` },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    // NOVO: ao aprovar (ou reactivar), o backend gera um novo código de
    // acesso ao portal de self-service — sem isto, a parceira nunca saberia
    // que esse código existe nem qual é.
    if (action === 'approve' && data.access_code) {
      sendCodeViaWhatsApp(id, data.access_code);
    }
    loadPartners(currentStatus);
  } catch (e) {
    alert('Erro: ' + e.message);
    if (card) card.style.opacity = '1';
  }
}

// NOVO: abre o WhatsApp da parceira com uma mensagem pronta a enviar,
// contendo o código de acesso e o link do portal. O admin só confirma o
// envio — não tem de compor a mensagem nem copiar/colar o código à mão.
function sendCodeViaWhatsApp(id, code) {
  const card = document.getElementById(`card-${id}`);
  const phoneMatch = card?.querySelector('.card-info')?.textContent || '';
  const waLink = card?.querySelector('.btn-wa')?.getAttribute('href') || '';
  const base = waLink.split('?')[0] || '';
  const msg = `Olá! A sua candidatura como parceira MzDocs Pro foi aprovada 🎉\n\nPara gerir os seus dados (horário, morada, serviços) aceda a:\nhttps://www.mzdocs.co.mz/parceiro-portal.html\n\nO seu código de acesso é: ${code}\n\nGuarde este código — vai precisar dele sempre que quiser entrar.`;
  if (base) window.open(`${base}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

// NOVO: gerar um novo código para uma parceira já aprovada que o perdeu,
// e abrir logo o WhatsApp com a mensagem pronta.
async function doRegenerateCode(id) {
  if (!confirm('Gerar um novo código de acesso? O código antigo deixa de funcionar.')) return;
  const card = document.getElementById(`card-${id}`);
  if (card) card.style.opacity = '0.5';
  try {
    const res = await fetch('/api/partners?action=regenerate-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${AUTH_TOKEN}` },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    sendCodeViaWhatsApp(id, data.access_code);
  } catch (e) {
    alert('Erro: ' + e.message);
  } finally {
    if (card) card.style.opacity = '1';
  }
}

async function doToggle(id, active) {
  const card = document.getElementById(`card-${id}`);
  if (card) card.style.opacity = '0.5';
  try {
    const res = await fetch('/api/partners?action=toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${AUTH_TOKEN}` },
      body: JSON.stringify({ id, active }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    loadPartners(currentStatus);
  } catch (e) {
    alert('Erro: ' + e.message);
    if (card) card.style.opacity = '1';
  }
}

// Enter para login
document.getElementById('adminPass')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>

<!-- NOVO: atribuição de origem (blog/pesquisa orgânica/social) — esta
     página é HTML estático, sem o MarketingTracker.js da SPA. Sem isto,
     um leitor que chegasse aqui pelo Google e depois clicasse para a app
     era sempre contado como "direct" no dashboard de Marketing. Mesma
     lógica usada em api/_lib/blogTemplate.js: 1) descobre a origem
     (?src= explícito > localStorage já existente > referrer de motor de
     busca/rede social > "direct" por omissão); 2) grava na mesma
     chave que o MarketingTracker usa (mzd_src); 3) por segurança (modo
     privado / localStorage bloqueado), também reescreve os links de saída
     marcados com data-track-link para incluir ?src=... -->
<script>
(function(){
  try {
    var SOURCE_KEY = 'mzd_src';
    var stored = null;
    try { stored = localStorage.getItem(SOURCE_KEY); } catch(_) {}

    var qs = new URLSearchParams(window.location.search);
    var explicit = qs.get('src');
    var source = explicit || stored;

    if (!source) {
      var host = '';
      try { host = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./,'') : ''; } catch(_) {}
      if (/mzdocs\.co\.mz$/.test(host))        source = null;
      else if (/google\./.test(host))          source = 'organic_google';
      else if (/bing\./.test(host))            source = 'organic_bing';
      else if (/yahoo\./.test(host))           source = 'organic_yahoo';
      else if (/duckduckgo\./.test(host))      source = 'organic_duckduckgo';
      else if (/baidu\./.test(host))           source = 'organic_baidu';
      else if (/facebook\.|instagram\./.test(host)) source = 'social_facebook';
      else if (/tiktok\./.test(host))          source = 'social_tiktok';
      else if (/whatsapp\./.test(host))        source = 'social_whatsapp';
      else                                     source = 'direct';
    }

    if (source) {
      try { localStorage.setItem(SOURCE_KEY, source.slice(0, 50)); } catch(_) {}
      document.querySelectorAll('a[data-track-link]').forEach(function(a){
        try {
          var u = new URL(a.getAttribute('href'), window.location.origin);
          if (!u.searchParams.get('src')) u.searchParams.set('src', source);
          a.setAttribute('href', u.pathname + u.search + u.hash);
        } catch(_) {}
      });
    }
  } catch(_) {}
})();
</script>
</body>
</html>
